<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#18181b"/>
  
  <!-- Taxi Sign on Roof -->
  <rect x="230" y="125" width="60" height="25" rx="6" fill="#facc15" />

  <!-- Taxi Body (Side Profile) -->
  <path d="M 90 280 
           L 90 240 
           C 90 230, 95 230, 110 230 
           L 150 230 
           L 200 150 
           C 220 120, 300 120, 320 150 
           L 380 230
           L 410 230 
           C 425 230, 430 230, 430 250
           L 430 280
           Z" fill="#facc15" />
           
  <!-- Windows -->
  <path d="M 210 155 
           C 220 140, 255 140, 260 155
           L 260 220 
           L 165 220 Z" fill="#18181b" />
  <path d="M 275 155
           C 280 140, 310 140, 315 155
           L 360 220
           L 275 220 Z" fill="#18181b" />
           
  <!-- Checker Pattern (Side Trim) -->
  <g fill="#18181b">
    <rect x="100" y="250" width="20" height="15" />
    <rect x="140" y="250" width="20" height="15" />
    <rect x="180" y="250" width="20" height="15" />
    <rect x="220" y="250" width="20" height="15" />
    <rect x="260" y="250" width="20" height="15" />
    <rect x="300" y="250" width="20" height="15" />
    <rect x="340" y="250" width="20" height="15" />
    <rect x="380" y="250" width="20" height="15" />
  </g>

  <!-- Left Wheel (Normal) -->
  <circle cx="160" cy="300" r="44" fill="#27272a" />
  <circle cx="160" cy="300" r="24" fill="#52525b" />
  <circle cx="160" cy="300" r="12" fill="#18181b" />
  
  <!-- Right Wheel (Coin €) -->
  <!-- Coin outer rim -->
  <circle cx="340" cy="300" r="52" fill="#eab308" />
  <!-- Coin inner rim -->
  <circle cx="340" cy="300" r="42" fill="#fef08a" stroke="#ca8a04" stroke-width="4" />
  <!-- Euro Symbol -->
  <text x="340" y="324" font-family="sans-serif" font-weight="900" font-size="64" fill="#854d0e" text-anchor="middle">€</text>
  
</svg>
